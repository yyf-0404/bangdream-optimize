[workspace]
members = [
    "crates/bangdream-account",
    "crates/core",
    "crates/data",
    "crates/desktop",
    "crates/service",
    "crates/single-dp",
    "crates/team-prune",
    "crates/medley-solver",
    "crates/storage-local",
    "crates/storage-mongodb",
    "crates/web-wasm",
    "apps/server",
    "tools/sync-bestdori",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/yyf-0404/bangdream-optimize"

[workspace.dependencies]
aes = "0.8.4"
async-trait = "0.1.89"
axum = "0.8.7"
bangdream-optimize-bangdream-account = { path = "crates/bangdream-account" }
bangdream-optimize-core = { path = "crates/core" }
bangdream-optimize-data = { path = "crates/data" }
bangdream-optimize-desktop = { path = "crates/desktop" }
bangdream-optimize-service = { path = "crates/service" }
bangdream-optimize-single-dp = { path = "crates/single-dp" }
bangdream-optimize-team-prune = { path = "crates/team-prune" }
bangdream-optimize-medley-solver = { path = "crates/medley-solver" }
bangdream-optimize-storage-local = { path = "crates/storage-local" }
bangdream-optimize-storage-mongodb = { path = "crates/storage-mongodb" }
mongodb = "3.3.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.11", features = ["cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
wasm-bindgen = "0.2"
