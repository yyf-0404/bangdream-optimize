# Reverse proxy for production deploy (static web + backend-hosted game-data + import proxies).
server {
  listen 80;
  server_name _;  # Replace with your domain, e.g. example.com

  root /var/www/bangdream-optimize/web; # e.g. /var/www/bangdream-optimize/web
  index index.html;

  # Proxy game-data served by the backend.
  location /game-data/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Desktop downloads. Put Windows packages in any server directory you prefer,
  # then point this alias at that directory. The web UI reads the JSON autoindex
  # and renders one download button per file.
  location /downloads/ {
    alias /var/www/bangdream-optimize/downloads/;
    autoindex on;
    autoindex_format json;
    add_header Content-Disposition "attachment";
  }

  # Frontend-only Bestdori profile import.
  location /bestdori/player/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # CN game account import. The backend owns the fixed persist/login state.
  location = /bangdream/user-data/import {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
