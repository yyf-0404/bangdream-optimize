# Reverse proxy for production deploy (static web + backend-hosted game-data + import proxies).
server {
  listen 80;
  server_name _;  # Replace with your domain, e.g. example.com

  root /var/www/bangdream-optimize/web; # e.g. /var/www/bangdream-optimize/web
  index index.html;

  # Proxy game-data served by the backend.
  location /game-data/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Desktop downloads. Put Windows packages in any server directory you prefer,
  # then point this alias at that directory. The web UI reads the JSON autoindex
  # and renders one download button per file.
  location /downloads/ {
    alias /var/www/bangdream-optimize/downloads/;
    autoindex on;
    autoindex_format json;
    add_header Content-Disposition "attachment";
  }

  # Fixed-origin images for activity textures and result-image export.
  location ^~ /bestdori/header/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend-only Bestdori profile import.
  location /bestdori/player/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Public feedback form. The backend fixes From/To and owns all SMTP credentials.
  location = /api/feedback {
    client_max_body_size 12m;
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Install this in the HTTPS server block for account/password import.
  location = /api/import/cn-account {
    client_max_body_size 8k;
    client_body_buffer_size 8k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 240s;
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Never include $request_body in access/error logs.
  }

  # Entry files must revalidate on navigation; keep ETag/304 support.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Do not let removed application assets fall back to HTML. These prefixes do
  # not match /game-data, /bestdori or /downloads and leave their policies alone.
  location /src/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }
  location /pkg/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback and root-level config/style/version files.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
