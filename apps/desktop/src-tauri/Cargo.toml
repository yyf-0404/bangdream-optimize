[package]
name = "bangdream-optimize-desktop-app"
version = "0.3.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/yyf-0404/bangdream-optimize"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bangdream-optimize-core = { path = "../../../crates/core" }
bangdream-optimize-desktop = { path = "../../../crates/desktop" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
